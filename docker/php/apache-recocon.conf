# RecoCon開発用: ディレクトリ閲覧・秘密情報へのHTTPアクセスを防止
<Directory "/var/www/html">
    Options -Indexes
    AllowOverride All
    Require all granted
    <FilesMatch "(?i)\.(sql|bak|log|ini|env|zip|tar|gz|md|txt)$">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/PHP/LogWriting/RecoCon_Log(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
