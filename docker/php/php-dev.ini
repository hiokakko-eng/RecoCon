; php-dev.iniは、どのプログラムを実行するかの設定ファイル。
; 対になるmsmtprcは、そのプログラムがどこへメールを送るか。
;
; 本番と同一ではない開発用の設定。PHPバージョンと拡張を照合する。
; たとえば本番環境ロリポップなら、ロリポップ側に設定ファイルが用意されているので開発側は記述の必要がないが、
; 開発用Docker環境では、設定ファイルが予めないので、別途このように作成する必要がある。

date.timezone = Asia/Tokyo
default_charset = UTF-8

; PHPエラーをログに記録するか。
log_errors = On

; PHPエラーの詳細を画面に表示するか。
display_errors = Off

; PHPエラー報告のレベル。「E_ALL」は警告や非推奨などすべて。
error_reporting = E_ALL

; sendmail_pathは、PHPがメール送信時に実行するコマンド。指定パスは、実行するプログラムのパス。
; -tはメールヘッダーのTo, Cc, Bccから送信先を読み取る。
; -iはSendmail互換のオプション。通常のSendmailでは、本文中の単独の.を終了記号として扱わない。互換性のため受け付ける
; だけで、実際には無視されるオプション。RecoConで実際にメールを送っているのはSendmailではなくmsmtpということ
sendmail_path = "/usr/bin/msmtp -t -i"
